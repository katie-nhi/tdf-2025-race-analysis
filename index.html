<body>
  <div id="__bundler_placeholder">Loading Tour de France 2025 race centre...</div>
  <div id="__bundler_loading">Unpacking...</div>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

n<div style=\"background: #F7F6FA; border-top: 1px solid #EFEDF4\">\n<div style=\"max-width: 1320px; margin: 0 auto; padding: 8px 24px; display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font-size: 13px; color: #3D3A4F\" aria-live=\"polite\">\n<strong style=\"color: #0E0A1F\">Showing<\u002Fstrong>\n<span style=\"background: #FFFFFF; border: 1px solid #E4E0EE; border-radius: 999px; padding: 3px 10px\">{{ctxStage}}<\u002Fspan>\n<span style=\"background: #FFFFFF; border: 1px solid #E4E0EE; border-radius: 999px; padding: 3px 10px\">{{ctxType}}<\u002Fspan>\n<sc-if value=\"{{ctxHasQ}}\" hint-placeholder-val=\"{{false}}\"><span style=\"background: #FCE8F0; border: 1px solid #F3B9CF; border-radius: 999px; padding: 3px 10px; color: #8E1849\">{{ctxSearch}}<\u002Fspan><\u002Fsc-if>\n<button type=\"button\" sc-camel-on-click=\"{{onReset}}\" style=\"margin-left: auto; height: 32px; padding: 0 12px; border: 1px solid #D5D0E2; border-radius: 8px; background: #FFFFFF; color: #0E0A1F; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer\">Reset all filters<\u002Fbutton><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<main style=\"max-width: 1320px; margin: 0 auto; padding: 16px 24px 28px; box-sizing: border-box; display: flex; flex-direction: column; gap: 40px\">\n<div style=\"display: flex; flex-direction: column; gap: 12px\">\n<sc-if value=\"{{spot.show}}\" hint-placeholder-val=\"{{false}}\">\n<section aria-label=\"Search result\" style=\"background: #FFFFFF; border: 1px solid #E7E4EE; border-radius: 14px; padding: 16px 18px; display: flex; flex-direction: column; gap: 12px; min-width: 0; box-shadow: 0 1px 2px rgba(15, 11, 45, 0.04), 0 10px 30px rgba(15, 11, 45, 0.05); flex-direction: row; flex-wrap: wrap; align-items: center; gap: 18px 28px; border: 2px solid #D6246E; animation: fadeUp 0.25s ease-out both\">\n<div style=\"display: flex; align-items: center; gap: 14px; min-width: 0\">\n<span style=\"width: 56px; height: 56px; border-radius: 50%; background: #1C1B25; color: #FFFFFF; font-family: 'Barlow Condensed', Inter, sans-serif; font-weight: 700; font-size: 22px; display: flex; align-items: center; justify-content: center; flex: 0 0 auto\">{{spot.ini}}<\u002Fspan>\n<div style=\"display: flex; flex-direction: column; gap: 2px; min-width: 0\">\n<span style=\"font-size: 11px; font-weight: 800; letter-spacing: 0.12em; color: #D6246E\">{{spot.kind}}<\u002Fspan>\n<strong style=\"font-family: 'Barlow Condensed', Inter, sans-serif; font-size: 28px; line-height: 1.05\">{{spot.name}}<\u002Fstrong>\n<span style=\"font-size: 13px; color: #5A566B\">{{spot.sub}}<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; flex-wrap: wrap; gap: 10px; flex: 1 1 420px\">\n<sc-for list=\"{{spot.stats}}\" as=\"x\" hint-placeholder-count=\"5\">\n<div style=\"display: flex; flex-direction: column; gap: 2px; padding: 8px 14px; background: #F7F6FA; border-radius: 10px; min-width: 110px\">\n<span style=\"font-size: 11px; font-weight: 700; color: #5A566B; text-transform: uppercase; letter-spacing: 0.06em\">{{x.l}}<\u002Fspan>\n<strong style=\"font-family: 'Barlow Condensed', Inter, sans-serif; font-size: 24px; line-height: 1.1\">{{x.v}}<\u002Fstrong>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<div style=\"display: flex; gap: 8px; flex-wrap: wrap\">\n<sc-if value=\"{{spot.canCompare}}\" hint-placeholder-val=\"{{false}}\"><a href=\"#h2h-card\" sc-camel-on-click=\"{{spot.compare}}\" style=\"height: 44px; padding: 0 14px; border-radius: 10px; background: #1C1B25; color: #FFFFFF; font-size: 14px; font-weight: 700; display: inline-flex; align-items: center; text-decoration: none\">Compare in head-to-head<\u002Fa><\u002Fsc-if>\n<button type=\"button\" sc-camel-on-click=\"{{onClearQ}}\" style=\"height: 44px; padding: 0 14px; border: 1px solid #D5D0E2; border-radius: 10px; background: #FFFFFF; color: #0E0A1F; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer\">Clear search<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fsection>\n<\u002Fsc-if>\n\n<\u002Fdiv>\n<section id=\"course\" data-chapter=\"course\" aria-labelledby=\"h2-course\" style=\"display: flex; flex-direction: column; gap: 14px\">\n<div style=\"display: flex; flex-direction: column; gap: 6px; padding-top: 8px; border-top: 2px solid #1C1B25\">\n<span style=\"font-size: 12px; font-weight: 800; letter-spacing: 0.18em; color: #3F3A9E; text-transform: uppercase\">Chapter 1 of 4 · The course<\u002Fspan>\n<h2 id=\"h2-course\" style=\"margin: 0; font-family: 'Barlow Condensed', Inter, sans-serif; font-weight: 700; font-size: 38px; line-height: 1.02; color: #1C1B25\">Race route: 3,302 km in 21 stages<\u002Fh2>\n<p style=\"margin: 0; font-size: 16px; line-height: 1.55; color: #3D3A4F; max-width: 860px\"><span style=\"display: block; font-family: 'Barlow Condensed', Inter, sans-serif; font-weight: 700; font-size: 24px; color: #1C1B25; margin-bottom: 4px\">Lille <span aria-label=\"to\" style=\"color: #3F3A9E\">→<\u002Fspan> Paris<\u002Fspan><span style=\"display: inline-flex; align-items: center; gap: 6px; margin-right: 14px\"><span style=\"width: 10px; height: 10px; border-radius: 50%; background: #2a78d6\"><\u002Fspan>7 flat<\u002Fspan><span style=\"display: inline-flex; align-items: center; gap: 6px; margin-right: 14px\"><span style=\"width: 10px; height: 10px; border-radius: 50%; background: #eb6834\"><\u002Fspan>6 hilly<\u002Fspan><span style=\"display: inline-flex; align-items: center; gap: 6px; margin-right: 14px\"><span style=\"width: 10px; height: 10px; border-radius: 50%; background: #1baf7a\"><\u002Fspan>6 mountain<\u002Fspan><span style=\"display: inline-flex; align-items: center; gap: 6px; margin-right: 14px\"><span style=\"width: 10px; height: 10px; border-radius: 50%; background: #eda100\"><\u002Fspan>2 time trials<\u002Fspan><\u002Fp>\n<\u002Fdiv>\n<section aria-labelledby=\"h-map\" style=\"background: #FFFFFF; border: 1px solid #E7E4EE; border-radius: 14px; padding: 16px 18px; display: flex; flex-direction: column; gap: 12px; min-width: 0; box-shadow: 0 1px 2px rgba(15, 11, 45, 0.04), 0 10px 30px rgba(15, 11, 45, 0.05)\">\n<div style=\"display: flex; justify-content: space-between; align-items: flex-start; gap: 12px\">\n<div style=\"display: flex; flex-direction: column; gap: 8px; min-width: 0\">\n<h3 id=\"h-map\" style=\"margin: 0; font-family: 'Barlow Condensed', Inter, sans-serif; font-weight: 700; font-size: 24px; line-height: 1.1; color: #1C1B25\">{{mapTitle}}<\u002Fh3>\n<p style=\"margin: 0; font-size: 13px; color: #5A566B\">Updates when you pick a stage or stage type, or press Play race.<\u002Fp>\n<\u002Fdiv>\n<div style=\"display: flex; align-items: center; gap: 8px; flex: 0 0 auto\">\n<div sc-camel-on-mouse-enter=\"{{inf.map.on}}\" sc-camel-on-mouse-leave=\"{{inf.map.off}}\" style=\"position: relative\">\n<button type=\"button\" sc-camel-on-click=\"{{inf.map.tog}}\" sc-camel-on-focus=\"{{inf.map.on}}\" sc-camel-on-blur=\"{{inf.map.off}}\" aria-expanded=\"{{inf.map.aria}}\" aria-label=\"How to read this map\" style=\"width: 40px; height: 40px; padding: 0; border: 0; background: transparent; cursor: help; display: flex; align-items: center; justify-content: center\">\n<span style=\"width: 26px; height: 26px; border-radius: 50%; background: {{inf.map.bg}}; color: {{inf.map.fg}}; border: 1.5px solid #3F3A9E; font-family: Georgia, serif; font-style: italic; font-weight: 700; font-size: 15px; line-height: 23px; text-align: center\">i<\u002Fspan>\n<\u002Fbutton>\n<sc-if value=\"{{inf.map.open}}\" hint-placeholder-val=\"{{false}}\">\n<div role=\"tooltip\" style=\"position: absolute; right: 4px; top: 44px; width: 310px; max-width: 80vw; z-index: 900; background: #1C1B25; color: #FFFFFF; padding: 14px 16px; border-radius: 12px; font-size: 13px; line-height: 1.55; box-shadow: 0 14px 36px rgba(15, 11, 45, 0.35); animation: fadeUp 0.18s ease-out both\">\n<span style=\"position: absolute; right: 15px; top: -6px; width: 12px; height: 12px; background: #1C1B25; transform: rotate(45deg)\"><\u002Fspan>\n<strong style=\"display: block; color: {{accent}}; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 4px\">How to read this<\u002Fstrong>Each coloured line is one stage, from its start town to its finish town, and its tag shows the stage number and a value. Use “Colour the route by” to switch between stage type, drop-outs, top-10 overtakes and distance. Click a stage to select it; every chapter then updates. Drag to move the map and use + and − to zoom.\n<\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; flex-wrap: wrap; gap: 16px; align-items: stretch\">\n<div data-mapwrap=\"\" style=\"flex: 1 1 100%; min-width: 0; border-radius: 12px; overflow: hidden; border: 1px solid #E7E4EE; background: #E9EEF2\"><div data-tdf-map=\"\" role=\"application\" aria-label=\"Map of the 2025 route across France. Select a stage with the pins or the Stage filter.\" style=\"width: 100%; height: 100%\"><\u002Fdiv><\u002Fdiv>\n<aside style=\"order: -1; flex: 1 1 100%; min-width: 0; display: flex; flex-wrap: wrap; align-items: stretch; gap: 12px\">\n<div style=\"flex: 1 1 420px; background: #1C1B25; color: #FFFFFF; border-radius: 12px; padding: 14px 18px; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 18px\">\n<span style=\"display: inline-flex; align-items: center; gap: 8px; font-size: 11px; font-weight: 800; letter-spacing: 0.12em; color: #C9C7D3; text-transform: uppercase\"><span style=\"width: 12px; height: 12px; border-radius: 3px; background: {{mapCol}}\"><\u002Fspan>{{mapKicker}}<\u002Fspan>\n<strong style=\"font-family: 'Barlow Condensed', Inter, sans-serif; font-size: 26px; line-height: 1.05\">{{mapRoute}}<\u002Fstrong>\n<span style=\"font-size: 13px; color: #DCD7EF\">{{mapMeta}}<\u002Fspan>\n<span style=\"font-size: 13px; color: #DCD7EF\">{{mapWin}}<\u002Fspan>\n<\u002Fdiv>\n<div style=\"display: flex; gap: 8px; flex-wrap: wrap; align-items: center\">\n<sc-if value=\"{{mapHasStage}}\" hint-placeholder-val=\"{{false}}\"><button type=\"button\" sc-camel-on-click=\"{{onAllStages}}\" style=\"height: 44px; padding: 0 14px; border: 1px solid #D5D0E2; border-radius: 10px; background: #FFFFFF; color: #0E0A1F; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer\">Show whole race<\u002Fbutton><\u002Fsc-if>\n<a href=\"{{mapLink}}\" target=\"_blank\" rel=\"noopener\" style=\"height: 44px; padding: 0 14px; border-radius: 10px; background: #1C1B25; color: #FFFFFF; font-size: 14px; font-weight: 700; display: inline-flex; align-items: center; gap: 6px; text-decoration: none\">{{mapLinkLabel}} <span aria-hidden=\"true\">↗<\u002Fspan><\u002Fa>\n<\u002Fdiv>\n<\u002Faside>\n<div data-tdf-prog=\"\" role=\"group\" aria-label=\"Race progress, Lille to Paris\" style=\"order: -1; flex: 1 1 100%; min-width: 0\"><\u002Fdiv>\n<\u002Fdiv>\n<p style=\"margin: 0; font-size: 12px; color: #5A566B\">Lines join start and finish towns (approximate positions), not the actual roads; mountain shading is illustrative.<\u002Fp>\n<\u002Fsection>\n<div style=\"display: flex; flex-wrap: wrap; gap: 12px; align-items: stretch\"><div style=\"flex: 7 1 600px; min-width: 0; display: flex; flex-direction: column; gap: 12px\"><section aria-labelledby=\"h-route\" style=\"background: #FFFFFF; border: 1px solid #E7E4EE; border-radius: 14px; padding: 16px 18px; display: flex; flex-direction: column; gap: 12px; min-width: 0; box-shadow: 0 1px 2px rgba(15, 11, 45, 0.04), 0 10px 30px rgba(15, 11, 45, 0.05); flex: 1 1 auto\">\n<div style=\"display: flex; justify-content: space-between; align-items: flex-start; gap: 12px\">\n<div style=\"display: flex; flex-direction: column; gap: 8px; min-width: 0\">\n<h3 id=\"h-route\" style=\"margin: 0; font-family: 'Barlow Condensed', Inter, sans-serif; font-weight: 700; font-size: 24px; line-height: 1.1; color: #1C1B25\">Stage distance and terrain profile<\u002Fh3>\n<div style=\"display: flex; gap: 6px; flex-wrap: wrap; align-items: center\"><span style=\"font-size: 13px; color: #5A566B; white-space: normal\">Updates when you change the stage or stage type filters.<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; align-items: center; gap: 8px; flex: 0 0 auto\">\n<div sc-camel-on-mouse-enter=\"{{inf.route.on}}\" sc-camel-on-mouse-leave=\"{{inf.route.off}}\" style=\"position: relative\">\n<button type=\"button\" sc-camel-on-click=\"{{inf.route.tog}}\" sc-camel-on-focus=\"{{inf.route.on}}\" sc-camel-on-blur=\"{{inf.route.off}}\" aria-expanded=\"{{inf.route.aria}}\" aria-label=\"How to read this chart\" style=\"width: 40px; height: 40px; padding: 0; border: 0; background: transparent; cursor: help; display: flex; align-items: center; justify-content: center\">\n<span style=\"width: 26px; height: 26px; border-radius: 50%; background: {{inf.route.bg}}; color: {{inf.route.fg}}; border: 1.5px solid #3F3A9E; font-family: Georgia, serif; font-style: italic; font-weight: 700; font-size: 15px; line-height: 23px; text-align: center\">i<\u002Fspan>\n<\u002Fbutton>\n<sc-if value=\"{{inf.route.open}}\" hint-placeholder-val=\"{{false}}\">\n<div role=\"tooltip\" style=\"position: absolute; right: 4px; top: 44px; width: 310px; max-width: 80vw; z-index: 60; background: #1C1B25; color: #FFFFFF; padding: 14px 16px; border-radius: 12px; font-size: 13px; line-height: 1.55; box-shadow: 0 14px 36px rgba(15, 11, 45, 0.35); animation: fadeUp 0.18s ease-out both\">\n<span style=\"position: absolute; right: 15px; top: -6px; width: 12px; height: 12px; background: #1C1B25; transform: rotate(45deg)\"><\u002Fspan>\n<strong style=\"display: block; color: {{accent}}; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 4px\">How to read this<\u002Fstrong>Each column is one stage, in race order. A taller column is a longer stage, and the colour shows the type of stage. Point at a column for details, or click it to select that stage. The race data has stage length and type but no altitude, so this chart shows distance rather than an elevation profile.\n<\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"position: relative; height: 222px; padding-left: 46px\">\n<span style=\"position: absolute; left: 0; right: 0; bottom: 64px; border-top: 1px solid #EFEDF4\"><\u002Fspan><span style=\"position: absolute; left: 0; bottom: 66px; font-size: 11px; color: #5A566B\">50 km<\u002Fspan><span style=\"position: absolute; left: 0; right: 0; bottom: 105px; border-top: 1px solid #EFEDF4\"><\u002Fspan><span style=\"position: absolute; left: 0; bottom: 107px; font-size: 11px; color: #5A566B\">100 km<\u002Fspan><span style=\"position: absolute; left: 0; right: 0; bottom: 145px; border-top: 1px solid #EFEDF4\"><\u002Fspan><span style=\"position: absolute; left: 0; bottom: 147px; font-size: 11px; color: #5A566B\">150 km<\u002Fspan><span style=\"position: absolute; left: 0; right: 0; bottom: 186px; border-top: 1px solid #EFEDF4\"><\u002Fspan><span style=\"position: absolute; left: 0; bottom: 188px; font-size: 11px; color: #5A566B\">200 km<\u002Fspan>\n<div style=\"position: absolute; left: 46px; right: 0; top: 0; bottom: 0; display: grid; grid-template-columns: repeat(21, minmax(0, 1fr)); gap: 4px; align-items: end\">\n<sc-for list=\"{{route}}\" as=\"c\" hint-placeholder-count=\"21\">\n<button type=\"button\" sc-camel-on-click=\"{{c.pick}}\" sc-camel-on-mouse-enter=\"{{c.over}}\" sc-camel-on-mouse-leave=\"{{c.out}}\" sc-camel-on-focus=\"{{c.over}}\" sc-camel-on-blur=\"{{c.out}}\" aria-label=\"{{c.aria}}\" aria-pressed=\"{{c.sel}}\" style=\"height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: stretch; gap: 6px; padding: 0; border: 0; background: transparent; cursor: pointer; opacity: {{c.op}}\">\n<span style=\"height: {{c.h}}px; background: {{c.col}}; border-radius: 6px 6px 2px 2px; box-shadow: {{c.ring}}; transition: height 0.3s ease\"><\u002Fspan>\n<span style=\"font-size: 11px; font-weight: {{c.fw}}; color: #3D3A4F; text-alig }}\" sc-camel-on-mouse-leave=\"{{inf.inc.off}}\" style=\"position: relative\">\n<button type=\"button\" sc-camel-on-click=\"{{inf.inc.tog}}\" sc-camel-on-focus=\"{{inf.inc.on}}\" sc-camel-on-blur=\"{{inf.inc.off}}\" aria-expanded=\"{{inf.inc.aria}}\" aria-label=\"How to read this chart\" style=\"width: 40px; height: 40px; padding: 0; border: 0; background: transparent; cursor: help; display: flex; align-items: center; justify-content: center\">\n<span style=\"width: 26px; height: 26px; border-radius: 50%; background: {{inf.inc.bg}}; color: {{inf.inc.fg}}; border: 1.5px solid #3F3A9E; font-family: Georgia, serif; font-style: italic; font-weight: 700; font-size: 15px; line-height: 23px; text-align: center\">i<\u002Fspan>\n<\u002Fbutton>\n<sc-if value=\"{{inf.inc.open}}\" hint-placeholder-val=\"{{false}}\">\n<div role=\"tooltip\" style=\"position: absolute; right: 4px; top: 44px; width: 310px; max-width: 80vw; z-index: 60; background: #1C1B25; color: #FFFFFF; padding: 14px 16px; border-radius: 12px; font-size: 13px; line-height: 1.55; box-shadow: 0 14px 36px rgba(15, 11, 45, 0.35); animation: fadeUp 0.18s ease-out both\">\n<span style=\"position: absolute; right: 15px; top: -6px; width: 12px; height: 12px; background: #1C1B25; transform: rotate(45deg)\"><\u002Fspan>\n<strong style=\"display: block; color: {{accent}}; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 4px\">How to read this<\u002Fstrong>{{inHow}}\n<\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 8px 10px; background: #F7F6FA; border-radius: 10px\"><span style=\"font-size: 13px; color: #1C1B25; font-weight: 600; flex: 1 1 220px\">{{inSub}}<\u002Fspan><sc-if value=\"{{inHasSel}}\" hint-placeholder-val=\"{{false}}\"><button type=\"button\" sc-camel-on-click=\"{{onExAll}}\" style=\"height: 32px; padding: 0 12px; border: 1px solid #D5D0E2; border-radius: 8px; background: #FFFFFF; color: #0E0A1F; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer\">Show all stages<\u002Fbutton><\u002Fsc-if><\u002Fdiv>\n<sc-if value=\"{{inEmpty}}\" hint-placeholder-val=\"{{false}}\"><p style=\"margin: 0; font-size: 14px; color: #3D3A4F; padding: 12px 8px\">Every rider who started this stage also finished it.<\u002Fp><\u002Fsc-if>\n<div style=\"overflow: auto; max-height: 222px\">\n<div role=\"table\" aria-labelledby=\"h-inc\" style=\"min-width: 420px; display: flex; flex-direction: column; font-size: 13px\">\n<div role=\"row\" style=\"display: grid; grid-template-columns: 58px minmax(140px, 1.3fr) minmax(110px, 1fr); gap: 8px; padding: 0 8px 8px; color: #5A566B; font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.08em; border-bottom: 2px solid #1C1B25; position: sticky; top: 0; background: #FFFFFF\">\n<span role=\"columnheader\">Stage<\u002Fspan><span role=\"columnheader\">Rider<\u002Fspan><span role=\"columnheader\">What happened<\u002Fspan>\n<\u002Fdiv>\n<sc-for list=\"{{inRows}}\" as=\"r\" hint-placeholder-count=\"24\">\n<div role=\"row\" style=\"display: grid; grid-template-columns: 58px minmax(140px, 1.3fr) minmax(110px, 1fr); gap: 8px; align-items: center; padding: 7px 8px; border-bottom: 1px solid #EFEDF4; outline: {{r.ol}}; outline-offset: -2px; opacity: {{r.op}}\">\n<span role=\"cell\" style=\"display: inline-flex; align-items: center; gap: 6px; font-weight: 700\"><span style=\"width: 10px; height: 10px; border-radius: 3px; background: {{r.col}}\"><\u002Fspan>{{r.s}}<\u002Fspan>\n<span role=\"cell\" style=\"display: flex; flex-direction: column\"><strong>{{r.name}}<\u002Fstrong><span style=\"font-size: 12px; color: #5A566B\">{{r.team}}<\u002Fspan><\u002Fspan>\n<span role=\"cell\" style=\"color: #3D3A4F\">{{r.what}}<\u002Fspan>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n<p style=\"margin: 0; font-size: 12px; color: #5A566B\">The race data records only whether a rider quit during a stage or did not start it, not the cause.<\u002Fp>\n<\u002Fsection><\u002Fdiv><\u002Fdiv>\n<div style=\"display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px; padding: 14px 18px; background: #EEECF8; border-radius: 14px\"><span style=\"font-size: 14px; color: #3D3A4F; flex: 1 1 320px\">Every rider races for a team and represents a country. Next: how those teams and nations performed.<\u002Fspan><a href=\"#teams\" data-next=\"\">Chapter 3: Teams &amp; nations <span aria-hidden=\"true\">→<\u002Fspan><\u002Fa><\u002Fdiv>\n<\u002Fsection>\n<section id=\"teams\" data-chapter=\"teams\" aria-labelledby=\"h2-teams\" style=\"display: flex; flex-direction: column; gap: 14px\">\n<div style=\"display: flex; flex-direction: column; gap: 6px; padding-top: 8px; border-top: 2px solid #1C1B25\">\n<span style=\"font-size: 12px; font-weight: 800; letter-spacing: 0.18em; color: #3F3A9E; text-transform: uppercase\">Chapter 3 of 4 · Teams &amp; nations<\u002Fspan>\n<h2 id=\"h2-teams\" style=\"margin: 0; font-family: 'Barlow Condensed', Inter, sans-serif; font-weight: 700; font-size: 38px; line-height: 1.02; color: #1C1B25\">Team and country performance<\u002Fh2>\n<\u002Fdiv>\n<section aria-labelledby=\"h-tmrank\" style=\"background: #FFFFFF; border: 1px solid #E7E4EE; border-radius: 14px; padding: 16px 18px; display: flex; flex-direction: column; gap: 12px; min-width: 0; box-shadow: 0 1px 2px rgba(15, 11, 45, 0.04), 0 10px 30px rgba(15, 11, 45, 0.05)\">\n<div style=\"display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap\">\n<div style=\"display: flex; flex-direction: column; gap: 6px; min-width: 0; flex: 1 1 300px\">\n<h3 id=\"h-tmrank\" style=\"margin: 0; font-family: 'Barlow Condensed', Inter, sans-serif; font-weight: 700; font-size: 24px; line-height: 1.1; color: #1C1B25\">Team classification<\u002Fh3>\n<span style=\"font-size: 13px; color: #5A566B\">Teams ranked by the lowest combined time of their three best riders on each stage, added up over all 21 stages. Team country is where the team is registered with the UCI. Click a team to see its riders.<\u002Fspan>\n<\u002Fdiv>\n<div style=\"display: flex; align-items: center; gap: 8px; flex: 0 0 auto\"><div role=\"group\" aria-label=\"Number of rows shown\" style=\"display: flex; gap: 2px; background: #F1EFF6; padding: 3px; border-radius: 10px\">\n<sc-for list=\"{{RKT.tabs}}\" as=\"t\" hint-placeholder-count=\"3\"><button type=\"button\" sc-camel-on-click=\"{{t.pick}}\" aria-pressed=\"{{t.on}}\" style=\"{{t.style}}\">{{t.label}}<\u002Fbutton><\u002Fsc-for>\n<\u002Fdiv>\n<div sc-camel-on-mouse-enter=\"{{inf.tmrank.on}}\" sc-camel-on-mouse-leave=\"{{inf.tmrank.off}}\" style=\"position: relative\">\n<button type=\"button\" sc-camel-on-click=\"{{inf.tmrank.tog}}\" sc-camel-on-focus=\"{{inf.tmrank.on}}\" sc-camel-on-blur=\"{{inf.tmrank.off}}\" aria-expanded=\"{{inf.tmrank.aria}}\" aria-label=\"How to read this table\" style=\"width: 40px; height: 40px; padding: 0; border: 0; background: transparent; cursor: help; display: flex; align-items: center; justify-content: center\">\n<span style=\"width: 26px; height: 26px; border-radius: 50%; background: {{inf.tmrank.bg}}; color: {{inf.tmrank.fg}}; border: 1.5px solid #3F3A9E; font-family: Georgia, serif; font-style: italic; font-weight: 700; font-size: 15px; line-height: 23px; text-align: center\">i<\u002Fspan>\n<\u002Fbutton>\n<sc-if value=\"{{inf.tmrank.open}}\" hint-placeholder-val=\"{{false}}\">\n<div role=\"tooltip\" style=\"position: absolute; right: 4px; top: 44px; width: 310px; max-width: 80vw; z-index: 900; background: #1C1B25; color: #FFFFFF; padding: 14px 16px; border-radius: 12px; font-size: 13px; line-height: 1.55; box-shadow: 0 14px 36px rgba(15, 11, 45, 0.35); animation: fadeUp 0.18s ease-out both\">\n<span style=\"position: absolute; right: 15px; top: -6px; width: 12px; height: 12px; background: #1C1B25; transform: rotate(45deg)\"><\u002Fspan>\n<strong style=\"display: block; color: {{accent}}; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 4px\">How to read this<\u002Fstrong>The team classification adds up the stage times of each team’s three best-placed riders on every stage; the team with the lowest cumulative total over the 21 stages wins. Time bonuses and penalties don’t count, and a team left with fewer than three riders is removed from the classification. There was no team time trial in 2025. The ranks and time gaps are the official final classification from the race data; Team country is the country of the team’s UCI registration (2025 team list), which is not in the race data and is not the riders’ nationality. Click a column heading to re-sort.\n<\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<label hidden style=\"display: none\"><span>Search for a team<\u002Fspan><svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" aria-hidden=\"true\" style=\"position: absolute; left: 12px; top: 14px\" fill=\"none\" stroke=\"#5A566B\" stroke-width=\"2.2\" stroke-linecap=\"round\"><circle cx=\"11\" cy=\"11\" r=\"7\"><\u002Fcircle><path d=\"M20 20l-3.5-3.5\"><\u002Fpath><\u002Fsvg><input type=\"search\" value=\"{{RKT.q}}\" sc-camel-on-input=\"{{RKT.onQ}}\" sc-camel-on-change=\"{{RKT.onQ}}\" placeholder=\"Search for a team, e.g. Visma\" autocomplete=\"off\" style=\"height: 44px; width: 100%; padding: 0 12px 0 36px; border: 1px solid #D5D0E2; border-radius: 10px; background: #FFFFFF; font: inherit; font-size: 14px; color: #0E0A1F; box-sizing: border-box\"><\u002Flabel>\n<sc-if value=\"{{RKT.empty}}\" hint-placeholder-val=\"{{false}}\"><p style=\"margin: 0; font-size: 14px; color: #3D3A4F\">No team matches that search.<\u002Fp><\u002Fsc-if>\n<div style=\"overflow-x: auto\"><div style=\"display: flex; flex-direction: column; font-size: 14px; min-width: 760px\">\n<div style=\"display: grid; grid-template-columns: 34px minmax(190px, 1.5fr) minmax(130px, 1fr) minmax(200px, 1.6fr) 90px 80px 26px; gap: 12px; align-
